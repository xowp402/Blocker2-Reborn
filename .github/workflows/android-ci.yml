name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK package named 'tools' is no longer published.
          packages: 'platform-tools'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKER2_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLOCKER2_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKER2_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOCKER2_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/blocker2-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              echo "BLOCKER2_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "BLOCKER2_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BLOCKER2_KEY_ALIAS=$KEY_ALIAS"
              echo "BLOCKER2_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No release keystore configured; the Release APK will be unsigned."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build optimized Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Blocker2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Blocker2-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
